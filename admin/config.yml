backend:
  name: github
  repo: ak47luisdaniel-ux/tekknystore-
  branch: main


media_folder: "images"
public_folder: "/images"

collections:
  - name: "productos"
    label: "Productos"
    folder: "content/productos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nombre del Producto", name: "title", widget: "string"}
      - {label: "Precio ($)", name: "price", widget: "string"}
      - {label: "Imagen", name: "image", widget: "image"}
      - {label: "Descripción", name: "description", widget: "text"}
      
